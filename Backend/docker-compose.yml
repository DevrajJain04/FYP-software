# Green Corridor Backend Services
# Note: 'version' attribute removed (obsolete in modern Docker Compose)

services:
  # Redis - Shared State Store
  redis:
    image: redis:7-alpine
    container_name: green-corridor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - green-corridor-network

  # AQI Scraper Service (provides fallback AQI data from stations)
  aqiscraper:
    build:
      context: ./aqiscraper
      dockerfile: Dockerfile
    container_name: green-corridor-aqiscraper
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - REDIS_URL=redis:6379
      - H3_RESOLUTION=9
      - SCRAPE_INTERVAL_MINUTES=30
      - STATION_TTL_MINUTES=60
      - WAQI_API_KEY=${WAQI_API_KEY:-demo}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - green-corridor-network
    restart: unless-stopped

  # TimescaleDB - Persistent Storage for Historical Analysis
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: green-corridor-timescaledb
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=green_corridor
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - green-corridor-network
    restart: unless-stopped

  # Go Ingestion Service
  ingestion-service:
    build:
      context: ./ingestion-service
      dockerfile: Dockerfile
    container_name: green-corridor-ingestion
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - REDIS_URL=redis:6379
      - POSTGRES_URL=postgres://postgres:postgres@timescaledb:5432/green_corridor?sslmode=disable
      - H3_RESOLUTION=9
      - AQI_TTL_SECONDS=300
      - ENABLE_PERSIST=true
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - green-corridor-network
    restart: unless-stopped

  # Python Routing Service
  routing-service:
    build:
      context: ./routing-service
      dockerfile: Dockerfile
    container_name: green-corridor-routing
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379
      - H3_RESOLUTION=9
      - GRAPH_CACHE_TTL=3600
      - USE_STATION_FALLBACK=true
      - SCRAPER_SERVICE_URL=http://aqiscraper:8082
    depends_on:
      redis:
        condition: service_healthy
      aqiscraper:
        condition: service_started
    networks:
      - green-corridor-network
    restart: unless-stopped

  # Redis Commander (Optional - for debugging)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: green-corridor-redis-ui
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - green-corridor-network
    profiles:
      - debug

  # pgAdmin (Optional - for database analysis)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: green-corridor-pgadmin
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@greencorridor.local
      - PGADMIN_DEFAULT_PASSWORD=admin
    depends_on:
      - timescaledb
    networks:
      - green-corridor-network
    profiles:
      - debug

networks:
  green-corridor-network:
    driver: bridge

volumes:
  redis_data:
  timescale_data:
